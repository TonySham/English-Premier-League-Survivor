<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPL Survivor Admin</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}
header{background:#111827;color:white;padding:20px;text-align:center}
main{padding:20px;max-width:900px;margin:auto}
.card{background:white;padding:20px;margin-bottom:15px;border-radius:12px;box-shadow:0 2px 8px #0001}
h1{margin:0;font-size:24px}
h2{margin-top:0}
.stat{font-size:30px;font-weight:bold}
</style>
</head>
<body>

<header>
<h1>⚽ EPL Survivor</h1>
<p>Admin Dashboard</p>
</header>

<main>

<div class="card">
<h2>Competition</h2>
<p><strong>Premier League Survivor 2026-27</strong></p>
<p>Status: <strong>Upcoming</strong></p>
</div>

<div class="card">
<h2>Current Week</h2>
<p class="stat">Week 1</p>
<p>Deadline: 11 September 2026, 20:00</p>
</div>

<div class="card">
<h2>Players</h2>
<p class="stat">7</p>
<p>Active players</p>
</div>

<div class="card">
<h2>Quick Actions</h2>
<button>Players</button>
<button>Weekly Selections</button>
<button>Fixtures & Results</button>
<button>Reports</button>
</div>

</main>

</body>
</html>
