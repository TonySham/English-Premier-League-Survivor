<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Premier League Survivor</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      background: #222;
      color: white;
      border: none;
    }

    button:hover {
      opacity: 0.9;
    }

    button.danger {
      background: #b00020;
    }

    button.secondary {
      background: #555;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #b00020;
      margin-top: 10px;
    }

    .success {
      color: #087f23;
      margin-top: 10px;
    }

    .muted {
      color: #666;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      vertical-align: middle;
    }

    .action-button {
      width: auto;
      display: inline-block;
      margin: 2px;
      padding: 8px 12px;
      font-size: 14px;
    }

    .status-active {
      color: #087f23;
      font-weight: bold;
    }

    .status-eliminated {
      color: #b00020;
      font-weight: bold;
    }

    .status-winner {
      color: #9a6700;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 15px;
      }

      table {
        font-size: 14px;
      }

      th, td {
        padding: 7px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginSection" class="card">
    <h1>English Premier League Survivor</h1>
    <h2>Admin Login</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="loginMessage"></div>
  </div>


  <div id="dashboardSection" class="hidden">

    <div class="card">
      <h1>Admin Dashboard</h1>
      <button onclick="logout()">Logout</button>
    </div>


    <div class="card">
      <h2>Competition</h2>
      <div id="competitionInfo">Loading...</div>
    </div>


    <div class="card">
      <h2>Player Management</h2>

      <p class="muted">
        Add players to the competition or edit their contact details.
      </p>

      <input id="newPlayerName" type="text" placeholder="Player name">
      <input id="newPlayerWhatsApp" type="text" placeholder="WhatsApp number">

      <button onclick="addPlayer()">Add Player</button>

      <div id="playerMessage"></div>

      <br>

      <div id="playersInfo">Loading...</div>
    </div>


    <div class="card">
      <h2>Weeks</h2>
      <div id="weeksInfo">Loading...</div>
    </div>


    <div class="card">
      <h2>Fixtures</h2>
      <div id="fixturesInfo">Loading...</div>
    </div>


    <div class="card">
      <h2>Weekly Results</h2>
      <div id="resultsInfo">Loading...</div>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL = "https://pkqzoxxjnzqaekhvnaku.supabase.co";

/*
  IMPORTANT:
  Replace the text below with your EXISTING publishable key.
  Do not change anything else.
*/
const SUPABASE_KEY = "sb_publishable_KVbBNWyIhdykAQsUf_yvhA_rupOxGSR";

const COMPETITION_ID = 1;

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   LOGIN
========================= */

async function login() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const message = document.getElementById("loginMessage");

  message.textContent = "Logging in...";
  message.className = "";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    message.textContent = error.message;
    message.className = "error";
    return;
  }

  message.textContent = "Login successful.";
  message.className = "success";

  showDashboard();

  await loadDashboard();
}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("dashboardSection")
    .classList.add("hidden");

  document
    .getElementById("loginSection")
    .classList.remove("hidden");
}


/* =========================
   SHOW DASHBOARD
========================= */

function showDashboard() {

  document
    .getElementById("loginSection")
    .classList.add("hidden");

  document
    .getElementById("dashboardSection")
    .classList.remove("hidden");
}


/* =========================
   LOAD EVERYTHING
========================= */

async function loadDashboard() {

  await loadCompetition();
  await loadPlayers();
  await loadWeeks();
  await loadFixtures();
  await loadResults();
}


/* =========================
   COMPETITION
========================= */

async function loadCompetition() {

  const box = document.getElementById("competitionInfo");

  const { data, error } =
    await supabaseClient
      .from("competitions")
      .select("*")
      .eq("id", COMPETITION_ID)
      .single();

  if (error) {
    box.innerHTML =
      "Error loading competition: " +
      escapeHtml(error.message);
    return;
  }

  if (!data) {
    box.innerHTML = "No competition found.";
    return;
  }

  box.innerHTML = `
    <strong>${escapeHtml(data.name)}</strong><br>
    League: ${escapeHtml(data.league || "")}<br>
    Status: ${escapeHtml(data.status || "")}<br>
    Bye rule: ${escapeHtml(data.bye_rule || "")}
  `;
}


/* =========================
   LOAD PLAYERS
========================= */

async function loadPlayers() {

  const box = document.getElementById("playersInfo");

  const { data, error } =
    await supabaseClient
      .from("competition_players")
      .select(`
        id,
        player_id,
        status,
        players (
          name,
          whatsapp_number
        )
      `)
      .eq("competition_id", COMPETITION_ID)
      .order("id");

  if (error) {
    box.innerHTML =
      "Error loading players: " +
      escapeHtml(error.message);
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "No players found.";
    return;
  }

  let html = `
    <table>
      <tr>
        <th>Player</th>
        <th>WhatsApp</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
  `;

  data.forEach(row => {

    const playerName =
      row.players?.name || "";

    const whatsapp =
      row.players?.whatsapp_number || "";

    let statusClass = "";

    if (row.status === "active") {
      statusClass = "status-active";
    }

    if (row.status === "eliminated") {
      statusClass = "status-eliminated";
    }

    if (row.status === "winner") {
      statusClass = "status-winner";
    }

    html += `
      <tr>

        <td>
          ${escapeHtml(playerName)}
        </td>

        <td>
          ${escapeHtml(whatsapp)}
        </td>

        <td class="${statusClass}">
          ${escapeHtml(row.status || "")}
        </td>

        <td>

          <button
            class="action-button"
            onclick="editPlayer(
              ${row.player_id},
              '${escapeJs(playerName)}',
              '${escapeJs(whatsapp)}'
            )">
            Edit
          </button>

          <button
            class="action-button danger"
            onclick="removePlayer(${row.id}, '${escapeJs(playerName)}')">
            Remove
          </button>

        </td>

      </tr>
    `;
  });

  html += "</table>";

  box.innerHTML = html;
}


/* =========================
   ADD PLAYER
========================= */

async function addPlayer() {

  const name =
    document
      .getElementById("newPlayerName")
      .value
      .trim();

  const whatsapp =
    document
      .getElementById("newPlayerWhatsApp")
      .value
      .trim();

  const message =
    document.getElementById("playerMessage");

  message.textContent = "";
  message.className = "";

  if (!name) {

    message.textContent =
      "Please enter the player's name.";

    message.className = "error";

    return;
  }


  /*
    First check whether a player with this name
    already exists.
  */

  const { data: existing, error: findError } =
    await supabaseClient
      .from("players")
      .select("id, name")
      .ilike("name", name);


  if (findError) {

    message.textContent =
      findError.message;

    message.className = "error";

    return;
  }


  let playerId;


  if (existing && existing.length > 0) {

    /*
      Existing player found.
      We reuse that player record.
    */

    playerId = existing[0].id;

    const { data: existingCompetitionPlayer, error: existingError } =
      await supabaseClient
        .from("competition_players")
        .select("id")
        .eq("competition_id", COMPETITION_ID)
        .eq("player_id", playerId)
        .maybeSingle();

    if (existingError) {

      message.textContent =
        existingError.message;

      message.className = "error";

      return;
    }

    if (existingCompetitionPlayer) {

      message.textContent =
        "That player is already in this competition.";

      message.className = "error";

      return;
    }


    const { error: updateError } =
      await supabaseClient
        .from("players")
        .update({
          whatsapp_number: whatsapp || null,
          active: true
        })
        .eq("id", playerId);

    if (updateError) {

      message.textContent =
        updateError.message;

      message.className = "error";

      return;
    }

  } else {

    /*
      Create a completely new player.
    */

    const { data: newPlayer, error: insertError } =
      await supabaseClient
        .from("players")
        .insert({
          name: name,
          whatsapp_number: whatsapp || null,
          active: true
        })
        .select()
        .single();

    if (insertError) {

      message.textContent =
        insertError.message;

      message.className = "error";

      return;
    }

    playerId = newPlayer.id;
  }


  /*
    Add player to this competition.
  */

  const { error: competitionError } =
    await supabaseClient
      .from("competition_players")
      .insert({
        competition_id: COMPETITION_ID,
        player_id: playerId,
        status: "active"
      });


  if (competitionError) {

    message.textContent =
      competitionError.message;

    message.className = "error";

    return;
  }


  document.getElementById("newPlayerName").value = "";
  document.getElementById("newPlayerWhatsApp").value = "";

  message.textContent =
    "Player added successfully.";

  message.className = "success";

  await loadPlayers();
}


/* =========================
   EDIT PLAYER
========================= */

async function editPlayer(
  playerId,
  currentName,
  currentWhatsApp
) {

  const newName =
    prompt(
      "Player name:",
      currentName
    );

  if (newName === null) {
    return;
  }

  const cleanName =
    newName.trim();

  if (!cleanName) {

    alert("Player name cannot be empty.");

    return;
  }


  const newWhatsApp =
    prompt(
      "WhatsApp number:",
      currentWhatsApp
    );

  if (newWhatsApp === null) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("players")
      .update({
        name: cleanName,
        whatsapp_number:
          newWhatsApp.trim() || null
      })
      .eq("id", playerId);


  if (error) {

    alert(
      "Could not update player:\n\n" +
      error.message
    );

    return;
  }


  alert("Player updated successfully.");

  await loadPlayers();
}


/* =========================
   REMOVE PLAYER
========================= */

async function removePlayer(
  competitionPlayerId,
  playerName
) {

  const confirmed =
    confirm(
      "Remove " +
      playerName +
      " from this competition?\n\n" +
      "Their existing history will be kept."
    );

  if (!confirmed) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("competition_players")
      .delete()
      .eq("id", competitionPlayerId);


  if (error) {

    alert(
      "Could not remove player:\n\n" +
      error.message
    );

    return;
  }


  alert(
    playerName +
    " has been removed from the competition."
  );

  await loadPlayers();
}


/* =========================
   WEEKS
========================= */

async function loadWeeks() {

  const box =
    document.getElementById("weeksInfo");

  const { data, error } =
    await supabaseClient
      .from("weeks")
      .select("*")
      .eq("competition_id", COMPETITION_ID)
      .order("week_number");


  if (error) {

    box.innerHTML =
      "Error loading weeks: " +
      escapeHtml(error.message);

    return;
  }


  if (!data || data.length === 0) {

    box.innerHTML =
      "No weeks found.";

    return;
  }


  let html =
    "<table>" +
    "<tr>" +
    "<th>Week</th>" +
    "<th>Deadline</th>" +
    "<th>Status</th>" +
    "</tr>";


  data.forEach(row => {

    html += `
      <tr>
        <td>${row.week_number}</td>
        <td>${escapeHtml(row.main_deadline || "")}</td>
        <td>${escapeHtml(row.status || "")}</td>
      </tr>
    `;

  });


  html += "</table>";

  box.innerHTML = html;
}


/* =========================
   FIXTURES
========================= */

async function loadFixtures() {

  const box =
    document.getElementById("fixturesInfo");


  const { data, error } =
    await supabaseClient
      .from("fixtures")
      .select(`
        scheduled_time,
        status,
        home_score,
        away_score,
        weeks (
          week_number
        ),
        home_team:teams!fixtures_home_team_id_fkey (
          name
        ),
        away_team:teams!fixtures_away_team_id_fkey (
          name
        )
      `)
      .order("scheduled_time");


  if (error) {

    box.innerHTML =
      "Error loading fixtures: " +
      escapeHtml(error.message);

    return;
  }


  if (!data || data.length === 0) {

    box.innerHTML =
      "No fixtures found.";

    return;
  }


  let html =
    "<table>" +
    "<tr>" +
    "<th>Week</th>" +
    "<th>Fixture</th>" +
    "<th>Score</th>" +
    "<th>Status</th>" +
    "</tr>";


  data.forEach(row => {

    const score =
      row.home_score !== null &&
      row.away_score !== null
        ? ${row.home_score} - ${row.away_score}
        : "-";


    html += `
      <tr>

        <td>
          ${row.weeks?.week_number || ""}
        </td>

        <td>
          ${escapeHtml(row.home_team?.name || "")}
          vs
          ${escapeHtml(row.away_team?.name || "")}
        </td>

        <td>
          ${score}
        </td>

        <td>
          ${escapeHtml(row.status || "")}
        </td>

      </tr>
    `;
  });


  html += "</table>";

  box.innerHTML = html;
}


/* =========================
   RESULTS
========================= */

async function loadResults() {

  const box =
    document.getElementById("resultsInfo");


  const { data, error } =
    await supabaseClient
      .from("weekly_results")
      .select(`
        outcome,
        notes,
        players (
          name
        ),
        weeks (
          week_number
        )
      `)
      .eq("competition_id", COMPETITION_ID)
      .order("week_id");


  if (error) {

    box.innerHTML =
      "Error loading results: " +
      escapeHtml(error.message);

    return;
  }


  if (!data || data.length === 0) {

    box.innerHTML =
      "No weekly results yet.";

    return;
  }


  let html =
    "<table>" +
    "<tr>" +
    "<th>Week</th>" +
    "<th>Player</th>" +
    "<th>Outcome</th>" +
    "</tr>";


  data.forEach(row => {

    html += `
      <tr>

        <td>
          ${row.weeks?.week_number || ""}
        </td>

        <td>
          ${escapeHtml(row.players?.name || "")}
        </td>

        <td>
          ${escapeHtml(row.outcome || "")}
        </td>

      </tr>
    `;

  });


  html += "</table>";

  box.innerHTML = html;
}


/* =========================
   SECURITY / DISPLAY HELPERS
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeJs(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "\\r")
    .replace(/\n/g, "\\n");
}


/* =========================
   REMEMBER LOGIN
========================= */

supabaseClient.auth.getSession().then(
  async ({ data }) => {

    if (data.session) {

      showDashboard();

      await loadDashboard();
    }

  }
);

</script>

</body>
</html>
