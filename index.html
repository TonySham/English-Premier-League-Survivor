<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Premier League Survivor</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      background: #222;
      color: white;
      border: none;
    }

    button:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #b00020;
      margin-top: 10px;
    }

    .success {
      color: #087f23;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginSection" class="card">
    <h1>English Premier League Survivor</h1>
    <h2>Admin Login</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="loginMessage"></div>
  </div>

  <div id="dashboardSection" class="hidden">

    <div class="card">
      <h1>Admin Dashboard</h1>
      <button onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Competition</h2>
      <div id="competitionInfo">Loading...</div>
    </div>

    <div class="card">
      <h2>Players</h2>
      <div id="playersInfo">Loading...</div>
    </div>

    <div class="card">
      <h2>Weeks</h2>
      <div id="weeksInfo">Loading...</div>
    </div>

    <div class="card">
      <h2>Fixtures</h2>
      <div id="fixturesInfo">Loading...</div>
    </div>

    <div class="card">
      <h2>Weekly Results</h2>
      <div id="resultsInfo">Loading...</div>
    </div>

  </div>

</div>

<script>

const SUPABASE_URL = "https://pkqzoxxjnzqaekhvnaku.supabase.co";
const SUPABASE_KEY = "sb_publishable_KVbBNWyIhdykAQsUf_yvhA_rupOxGSR";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function login() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const message = document.getElementById("loginMessage");

  message.textContent = "Logging in...";
  message.className = "";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    message.textContent = error.message;
    message.className = "error";
    return;
  }

  message.textContent = "Login successful.";
  message.className = "success";

  showDashboard();
  await loadDashboard();
}

async function logout() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("dashboardSection")
    .classList.add("hidden");

  document
    .getElementById("loginSection")
    .classList.remove("hidden");
}

function showDashboard() {

  document
    .getElementById("loginSection")
    .classList.add("hidden");

  document
    .getElementById("dashboardSection")
    .classList.remove("hidden");
}

async function loadDashboard() {

  await loadCompetition();
  await loadPlayers();
  await loadWeeks();
  await loadFixtures();
  await loadResults();
}

async function loadCompetition() {

  const box = document.getElementById("competitionInfo");

  const { data, error } =
    await supabaseClient
      .from("competitions")
      .select("*")
      .order("id")
      .limit(1);

  if (error) {
    box.innerHTML = "Error loading competition: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "No competition found.";
    return;
  }

  const c = data[0];

  box.innerHTML = `
    <strong>${escapeHtml(c.name)}</strong><br>
    League: ${escapeHtml(c.league || "")}<br>
    Status: ${escapeHtml(c.status || "")}<br>
    Bye rule: ${escapeHtml(c.bye_rule || "")}
  `;
}

async function loadPlayers() {

  const box = document.getElementById("playersInfo");

  const { data, error } =
    await supabaseClient
      .from("competition_players")
      .select(`
        status,
        players (
          name
        )
      `)
      .eq("competition_id", 1)
      .order("id");

  if (error) {
    box.innerHTML = "Error loading players: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "No players found.";
    return;
  }

  let html = "<table><tr><th>Player</th><th>Status</th></tr>";

  data.forEach(row => {

    html += `
      <tr>
        <td>${escapeHtml(row.players?.name || "")}</td>
        <td>${escapeHtml(row.status || "")}</td>
      </tr>
    `;

  });

  html += "</table>";

  box.innerHTML = html;
}

async function loadWeeks() {

  const box = document.getElementById("weeksInfo");

  const { data, error } =
    await supabaseClient
      .from("weeks")
      .select("*")
      .eq("competition_id", 1)
      .order("week_number");

  if (error) {
    box.innerHTML = "Error loading weeks: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "No weeks found.";
    return;
  }

  let html =
    "<table><tr><th>Week</th><th>Deadline</th><th>Status</th></tr>";

  data.forEach(row => {

    html += `
      <tr>
        <td>${row.week_number}</td>
        <td>${escapeHtml(row.main_deadline || "")}</td>
        <td>${escapeHtml(row.status || "")}</td>
      </tr>
    `;

  });

  html += "</table>";

  box.innerHTML = html;
}

async function loadFixtures() {

  const box = document.getElementById("fixturesInfo");

  const { data, error } =
    await supabaseClient
      .from("fixtures")
      .select(`
        scheduled_time,
        status,
        home_score,
        away_score,
        weeks (
          week_number
        ),
        home_team:teams!fixtures_home_team_id_fkey (
          name
        ),
        away_team:teams!fixtures_away_team_id_fkey (
          name
        )
      `)
      .order("scheduled_time");

  if (error) {
    box.innerHTML = "Error loading fixtures: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "No fixtures found.";
    return;
  }

  let html =
    "<table><tr><th>Week</th><th>Fixture</th><th>Score</th><th>Status</th></tr>";

  data.forEach(row => {

    const score =
      row.home_score !== null && row.away_score !== null
        ? `${row.home_score} - ${row.away_score}`
        : "-";

    html += `
      <tr>
        <td>${row.weeks?.week_number || ""}</td>
        <td>
          ${escapeHtml(row.home_team?.name || "")}
          vs
          ${escapeHtml(row.away_team?.name || "")}
        </td>
        <td>${score}</td>
        <td>${escapeHtml(row.status || "")}</td>
      </tr>
    `;

  });

  html += "</table>";

  box.innerHTML = html;
}

async function loadResults() {

  const box = document.getElementById("resultsInfo");

  const { data, error } =
    await supabaseClient
      .from("weekly_results")
      .select(`
        outcome,
        notes,
        players (
          name
        ),
        weeks (
          week_number
        )
      `)
      .eq("competition_id", 1)
      .order("week_id");

  if (error) {
    box.innerHTML = "Error loading results: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = "No weekly results yet.";
    return;
  }

  let html =
    "<table><tr><th>Week</th><th>Player</th><th>Outcome</th></tr>";

  data.forEach(row => {

    html += `
      <tr>
        <td>${row.weeks?.week_number || ""}</td>
        <td>${escapeHtml(row.players?.name || "")}</td>
        <td>${escapeHtml(row.outcome || "")}</td>
      </tr>
    `;

  });

  html += "</table>";

  box.innerHTML = html;
}

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

supabaseClient.auth.getSession().then(async ({ data }) => {

  if (data.session) {
    showDashboard();
    await loadDashboard();
  }

});

</script>

</body>
</html>
