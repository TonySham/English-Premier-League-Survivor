<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Premier League Survivor</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    text-align: center;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h1, h2 {
    margin-top: 0;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 12px 18px;
    margin: 5px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-weight: bold;
}

button:hover {
    opacity: 0.9;
}

.logout {
    background: #dc2626;
}

.hidden {
    display: none;
}

.stat {
    display: inline-block;
    min-width: 180px;
    margin: 8px;
    padding: 15px;
    background: #eef2ff;
    border-radius: 10px;
}

.stat strong {
    display: block;
    font-size: 24px;
    margin-top: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

.status-active {
    color: green;
    font-weight: bold;
}

.status-eliminated {
    color: red;
    font-weight: bold;
}

.status-winner {
    color: #b45309;
    font-weight: bold;
}

#error {
    color: #dc2626;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>
    <h1>English Premier League Survivor</h1>
    <p>Admin Dashboard</p>
</header>

<div class="container">

    <!-- LOGIN -->
    <div id="loginSection" class="card">
        <h2>Admin Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Admin email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button id="loginButton">Login</button>

        <div id="error"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardSection" class="hidden">

        <div class="card">
            <button class="logout" id="logoutButton">Logout</button>

            <h2>Competition Dashboard</h2>

            <div id="competitionInfo">
                Loading competition...
            </div>
        </div>

        <div class="card">
            <h2>Players</h2>

            <div id="playersStats">
                Loading players...
            </div>

            <div id="playersTable">
            </div>
        </div>

        <div class="card">
            <h2>Weekly Selections</h2>

            <div id="selectionsTable">
                Loading selections...
            </div>
        </div>

        <div class="card">
            <h2>Fixtures</h2>

            <div id="fixturesTable">
                Loading fixtures...
            </div>
        </div>

        <div class="card">
            <h2>Weekly Results</h2>

            <div id="resultsTable">
                Loading results...
            </div>
        </div>

    </div>

</div>

<script>
const SUPABASE_URL = "https://pkqzoxxjnzqaekhvnaku.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_KVbBNWyIhdykAQsUf_yvhA_rupOxGSR";

let supabaseClient = null;


/* ------------------------------
   SUPABASE CONNECTION
--------------------------------*/

function getSupabase() {

    if (!window.supabase) {
        document.getElementById("error").textContent =
            "Supabase library could not load. Please refresh the page.";

        return null;
    }

    if (!supabaseClient) {
        supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );
    }

    return supabaseClient;
}


/* ------------------------------
   LOGIN
--------------------------------*/

async function login() {

    const client = getSupabase();

    if (!client) return;

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    error.textContent = "";

    if (!email || !password) {
        error.textContent =
            "Please enter your email and password.";

        return;
    }

    const { data, error: loginError } =
        await client.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (loginError) {

        error.textContent =
            loginError.message;

        return;
    }

    document.getElementById("loginSection")
        .classList.add("hidden");

    document.getElementById("dashboardSection")
        .classList.remove("hidden");

    await loadDashboard();
}


/* ------------------------------
   LOGOUT
--------------------------------*/

async function logout() {

    const client = getSupabase();

    if (!client) return;

    await client.auth.signOut();

    document.getElementById("dashboardSection")
        .classList.add("hidden");

    document.getElementById("loginSection")
        .classList.remove("hidden");
}


/* ------------------------------
   DASHBOARD
--------------------------------*/

async function loadDashboard() {

    const client = getSupabase();

    if (!client) return;

    await loadCompetition();
    await loadPlayers();
    await loadSelections();
    await loadFixtures();
    await loadResults();
}


/* ------------------------------
   COMPETITION
--------------------------------*/

async function loadCompetition() {

    const client = getSupabase();

    const { data, error } =
        await client
        .from("competitions")
        .select("*")
        .order("id", { ascending: false })
        .limit(1)
        .maybeSingle();

    const element =
        document.getElementById("competitionInfo");

    if (error) {

        element.textContent =
            "Error loading competition: " +
            error.message;

        return;
    }

    if (!data) {

        element.textContent =
            "No competition found.";

        return;
    }

    element.innerHTML = `
        <p><strong>${data.name}</strong></p>
        <p>League: ${data.league}</p>
        <p>Status: ${data.status}</p>
        <p>Bye rule: ${data.bye_rule}</p>
    `;
}


/* ------------------------------
   PLAYERS
--------------------------------*/

async function loadPlayers() {

    const client = getSupabase();

    const { data, error } =
        await client
        .from("competition_players")
        .select(`
            id,
            status,
            player_id,
            players (
                name
            )
        `)
        .eq("competition_id", 1)
        .order("player_id");

    const stats =
        document.getElementById("playersStats");

    const table =
        document.getElementById("playersTable");

    if (error) {

        stats.textContent =
            "Error loading players: " +
            error.message;

        return;
    }

    const active =
        data.filter(p => p.status === "active").length;

    const eliminated =
        data.filter(p => p.status === "eliminated").length;

    const winners =
        data.filter(p => p.status === "winner").length;

    stats.innerHTML = `
        <div class="stat">
            Active
            <strong>${active}</strong>
        </div>

        <div class="stat">
            Eliminated
            <strong>${eliminated}</strong>
        </div>

        <div class="stat">
            Winner
            <strong>${winners}</strong>
        </div>
    `;

    let html = `
        <table>
        <tr>
            <th>Player</th>
            <th>Status</th>
        </tr>
    `;

    data.forEach(player => {

        html += `
            <tr>
                <td>${player.players?.name || "Unknown"}</td>
                <td class="status-${player.status}">
                    ${player.status}
                </td>
            </tr>
        `;
    });

    html += "</table>";

    table.innerHTML = html;
}


/* ------------------------------
   SELECTIONS
--------------------------------*/

async function loadSelections() {

    const client = getSupabase();

    const { data, error } =
        await client
        .from("selections")
        .select(`
            *,
            players (
                name
            ),
            teams (
                name
            ),
            weeks (
                week_number,
                main_deadline
            )
        `)
        .eq("competition_id", 1)
        .order("week_id")
        .order("player_id");

    const element =
        document.getElementById("selectionsTable");

    if (error) {

        element.textContent =
            "Error loading selections: " +
            error.message;

        return;
    }

    if (!data.length) {

        element.textContent =
            "No selections yet.";

        return;
    }

    let html = `
        <table>
        <tr>
            <th>Week</th>
            <th>Player</th>
            <th>Team</th>
            <th>Official</th>
        </tr>
    `;

    data.forEach(selection => {

        html += `
            <tr>
                <td>${selection.weeks?.week_number || ""}</td>
                <td>${selection.players?.name || ""}</td>
                <td>${selection.teams?.name || ""}</td>
                <td>${selection.is_official ? "Yes" : "No"}</td>
            </tr>
        `;
    });

    html += "</table>";

    element.innerHTML = html;
}


/* ------------------------------
   FIXTURES
--------------------------------*/

async function loadFixtures() {

    const client = getSupabase();

    const { data, error } =
        await client
        .from("fixtures")
        .select(`
            *,
            weeks (
                week_number
            ),
            home_team:teams!fixtures_home_team_id_fkey (
                name
            ),
            away_team:teams!fixtures_away_team_id_fkey (
                name
            )
        `)
        .order("week_id")
        .order("scheduled_time");

    const element =
        document.getElementById("fixturesTable");

    if (error) {

        element.textContent =
            "Error loading fixtures: " +
            error.message;

        return;
    }

    let html = `
        <table>
        <tr>
            <th>Week</th>
            <th>Match</th>
            <th>Status</th>
            <th>Score</th>
        </tr>
    `;

    data.forEach(fixture => {

        const score =
            fixture.home_score === null
            ? "-"
            : ${fixture.home_score} - ${fixture.away_score};

        html += `
            <tr>
                <td>${fixture.weeks?.week_number || ""}</td>
                <td>
                    ${fixture.home_team?.name || ""}
                    vs
                    ${fixture.away_team?.name || ""}
                </td>
                <td>${fixture.status}</td>
                <td>${score}</td>
            </tr>
        `;
    });

    html += "</table>";

    element.innerHTML = html;
}


/* ------------------------------
   RESULTS
--------------------------------*/

async function loadResults() {

    const client = getSupabase();

    const { data, error } =
        await client
        .from("weekly_results")
        .select(`
            *,
            players (
                name
            ),
            weeks (
                week_number
            )
        `)
        .eq("competition_id", 1)
        .order("week_id")
        .order("player_id");

    const element =
        document.getElementById("resultsTable");

    if (error) {

        element.textContent =
            "Error loading results: " +
            error.message;

        return;
    }

    if (!data.length) {

        element.textContent =
            "No weekly results yet.";

        return;
    }

    let html = `
        <table>
        <tr>
            <th>Week</th>
            <th>Player</th>
            <th>Outcome</th>
            <th>Notes</th>
        </tr>
    `;

    data.forEach(result => {

        html += `
            <tr>
                <td>${result.weeks?.week_number || ""}</td>
                <td>${result.players?.name || ""}</td>
                <td>${result.outcome}</td>
                <td>${result.notes || ""}</td>
            </tr>
        `;
    });

    html += "</table>";

    element.innerHTML = html;
}


/* ------------------------------
   BUTTONS
--------------------------------*/

document
    .getElementById("loginButton")
    .addEventListener("click", login);

document
    .getElementById("logoutButton")
    .addEventListener("click", logout);


/* ------------------------------
   CHECK EXISTING LOGIN
--------------------------------*/

async function checkLogin() {

    const client = getSupabase();

    if (!client) return;

    const {
        data: { session }
    } = await client.auth.getSession();

    if (session) {

        document.getElementById("loginSection")
            .classList.add("hidden");

        document.getElementById("dashboardSection")
            .classList.remove("hidden");

        await loadDashboard();
    }
}

checkLogin();

</script>

</body>
</html>
