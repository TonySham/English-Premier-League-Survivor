<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Premier League Survivor</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 12px 20px;
    margin-top: 8px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-weight: bold;
}

button:hover {
    opacity: 0.9;
}

.logout {
    background: #dc2626;
}

.hidden {
    display: none;
}

.error {
    color: #dc2626;
    margin-top: 10px;
}

.success {
    color: #15803d;
    margin-top: 10px;
}

.stat {
    display: inline-block;
    min-width: 160px;
    margin: 6px;
    padding: 15px;
    background: #eef2ff;
    border-radius: 10px;
}

.stat strong {
    display: block;
    font-size: 24px;
    margin-top: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

.status-active {
    color: green;
    font-weight: bold;
}

.status-eliminated {
    color: red;
    font-weight: bold;
}

.status-winner {
    color: #b45309;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>English Premier League Survivor</h1>
    <p>Admin Dashboard</p>
</header>

<div class="container">

<div id="loginSection" class="card">

    <h2>Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Admin email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button id="loginButton">Login</button>

    <div id="errorMessage" class="error"></div>

</div>


<div id="dashboardSection" class="hidden">

    <div class="card">

        <button id="logoutButton" class="logout">
            Logout
        </button>

        <h2>Competition Dashboard</h2>

        <div id="competitionInfo">
            Loading...
        </div>

    </div>


    <div class="card">

        <h2>Players</h2>

        <div id="playersStats">
            Loading...
        </div>

        <div id="playersTable">
        </div>

    </div>


    <div class="card">

        <h2>Weekly Selections</h2>

        <div id="selectionsTable">
            Loading...
        </div>

    </div>


    <div class="card">

        <h2>Fixtures</h2>

        <div id="fixturesTable">
            Loading...
        </div>

    </div>


    <div class="card">

        <h2>Weekly Results</h2>

        <div id="resultsTable">
            Loading...
        </div>

    </div>

</div>

</div>


<script>

const SUPABASE_URL = "https://pkqzoxxjnzqaekhvnaku.supabase.co";

const SUPABASE_KEY = "sb_publishable_KVbBNWyIhdykAQsUf_yvhA_rupOxGSR";


let supabaseClient = null;


function getSupabaseClient() {

    if (!window.supabase) {

        showError(
            "The Supabase library did not load. Please refresh the page."
        );

        return null;
    }

    if (!supabaseClient) {

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );
    }

    return supabaseClient;
}


function showError(message) {

    const element =
        document.getElementById("errorMessage");

    if (element) {
        element.textContent = message;
    }
}


async function login() {

    const client = getSupabaseClient();

    if (!client) {
        return;
    }

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    showError("");


    if (!email || !password) {

        showError(
            "Please enter your email and password."
        );

        return;
    }


    const result =
        await client.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (result.error) {

        showError(result.error.message);

        return;
    }


    document
        .getElementById("loginSection")
        .classList.add("hidden");


    document
        .getElementById("dashboardSection")
        .classList.remove("hidden");


    await loadDashboard();
}


async function logout() {

    const client = getSupabaseClient();

    if (!client) {
        return;
    }

    await client.auth.signOut();


    document
        .getElementById("dashboardSection")
        .classList.add("hidden");


    document
        .getElementById("loginSection")
        .classList.remove("hidden");
}


async function loadDashboard() {

    await loadCompetition();

    await loadPlayers();

    await loadSelections();

    await loadFixtures();

    await loadResults();
}


async function loadCompetition() {

    const client = getSupabaseClient();

    if (!client) {
        return;
    }


    const result =
        await client
        .from("competitions")
        .select("*")
        .order("id", { ascending: false })
        .limit(1)
        .maybeSingle();


    const element =
        document.getElementById("competitionInfo");


    if (result.error) {

        element.textContent =
            result.error.message;

        return;
    }


    if (!result.data) {

        element.textContent =
            "No competition found.";

        return;
    }


    const competition =
        result.data;


    element.innerHTML =
        "<p><strong>" +
        competition.name +
        "</strong></p>" +

        "<p>League: " +
        competition.league +
        "</p>" +

        "<p>Status: " +
        competition.status +
        "</p>" +

        "<p>Bye rule: " +
        competition.bye_rule +
        "</p>";
}


async function loadPlayers() {

    const client = getSupabaseClient();

    if (!client) {
        return;
    }


    const result =
        await client
        .from("competition_players")
        .select(`
            id,
            status,
            player_id,
            players (
                name
            )
        `)
        .eq("competition_id", 1)
        .order("player_id");


    const stats =
        document.getElementById("playersStats");

    const table =
        document.getElementById("playersTable");


    if (result.error) {

        stats.textContent =
            result.error.message;

        return;
    }


    const players =
        result.data || [];


    const active =
        players.filter(
            p => p.status === "active"
        ).length;


    const eliminated =
        players.filter(
            p => p.status === "eliminated"
        ).length;


    const winners =
        players.filter(
            p => p.status === "winner"
        ).length;


    stats.innerHTML =

        "<div class='stat'>" +
        "Active" +
        "<strong>" + active + "</strong>" +
        "</div>" +

        "<div class='stat'>" +
        "Eliminated" +
        "<strong>" + eliminated + "</strong>" +
        "</div>" +

        "<div class='stat'>" +
        "Winner" +
        "<strong>" + winners + "</strong>" +
        "</div>";


    let html =
        "<table>" +
        "<tr>" +
        "<th>Player</th>" +
        "<th>Status</th>" +
        "</tr>";


    players.forEach(player => {

        html +=

            "<tr>" +

            "<td>" +
            (player.players?.name || "Unknown") +
            "</td>" +

            "<td class='status-" +
            player.status +
            "'>" +
            player.status +
            "</td>" +

            "</tr>";
    });


    html += "</table>";

    table.innerHTML = html;
}


async function loadSelections() {

    const client = getSupabaseClient();

    if (!client) {
        return;
    }


    const result =
        await client
        .from("selections")
        .select(`
            *,
            players (
                name
            ),
            teams (
                name
            ),
            weeks (
                week_number
            )
        `)
        .eq("competition_id", 1)
        .order("week_id")
        .order("player_id");


    const element =
        document.getElementById("selectionsTable");


    if (result.error) {

        element.textContent =
            result.error.message;

        return;
    }


    const selections =
        result.data || [];


    if (!selections.length) {

        element.textContent =
            "No selections yet.";

        return;
    }


    let html =
        "<table>" +

        "<tr>" +
        "<th>Week</th>" +
        "<th>Player</th>" +
        "<th>Team</th>" +
        "<th>Official</th>" +
        "</tr>";


    selections.forEach(selection => {

        html +=

            "<tr>" +

            "<td>" +
            (selection.weeks?.week_number || "") +
            "</td>" +

            "<td>" +
            (selection.players?.name || "") +
            "</td>" +

            "<td>" +
            (selection.teams?.name || "") +
            "</td>" +

            "<td>" +
            (selection.is_official ? "Yes" : "No") +
            "</td>" +

            "</tr>";
    });


    html += "</table>";

    element.innerHTML = html;
}


async function loadFixtures() {

    const client = getSupabaseClient();

    if (!client) {
        return;
    }


    const result =
        await client
        .from("fixtures")
        .select(`
            *,
            weeks (
                week_number
            ),
            home_team:teams!fixtures_home_team_id_fkey (
                name
            ),
            away_team:teams!fixtures_away_team_id_fkey (
                name
            )
        `)
        .order("week_id")
        .order("scheduled_time");


    const element =
        document.getElementById("fixturesTable");


    if (result.error) {

        element.textContent =
            result.error.message;

        return;
    }


    const fixtures =
        result.data || [];


    let html =
        "<table>" +

        "<tr>" +
        "<th>Week</th>" +
        "<th>Match</th>" +
        "<th>Status</th>" +
        "<th>Score</th>" +
        "</tr>";


    fixtures.forEach(fixture => {

        let score = "-";


        if (
            fixture.home_score !== null &&
            fixture.away_score !== null
        ) {

            score =
                fixture.home_score +
                " - " +
                fixture.away_score;
        }


        html +=

            "<tr>" +

            "<td>" +
            (fixture.weeks?.week_number || "") +
            "</td>" +

            "<td>" +
            (fixture.home_team?.name || "") +
            " vs " +
            (fixture.away_team?.name || "") +
            "</td>" +

            "<td>" +
            fixture.status +
            "</td>" +

            "<td>" +
            score +
            "</td>" +

            "</tr>";
    });


    html += "</table>";

    element.innerHTML = html;
}


async function loadResults() {

    const client = getSupabaseClient();

    if (!client) {
        return;
    }


    const result =
        await client
        .from("weekly_results")
        .select(`
            *,
            players (
                name
            ),
            weeks (
                week_number
            )
        `)
        .eq("competition_id", 1)
        .order("week_id")
        .order("player_id");


    const element =
        document.getElementById("resultsTable");


    if (result.error) {

        element.textContent =
            result.error.message;

        return;
    }


    const results =
        result.data || [];


    if (!results.length) {

        element.textContent =
            "No weekly results yet.";

        return;
    }


    let html =
        "<table>" +

        "<tr>" +
        "<th>Week</th>" +
        "<th>Player</th>" +
        "<th>Outcome</th>" +
        "<th>Notes</th>" +
        "</tr>";


    results.forEach(item => {

        html +=

            "<tr>" +

            "<td>" +
            (item.weeks?.week_number || "") +
            "</td>" +

            "<td>" +
            (item.players?.name || "") +
            "</td>" +

            "<td>" +
            item.outcome +
            "</td>" +

            "<td>" +
            (item.notes || "") +
            "</td>" +

            "</tr>";
    });


    html += "</table>";

    element.innerHTML = html;
}


document
    .getElementById("loginButton")
    .addEventListener("click", login);


document
    .getElementById("logoutButton")
    .addEventListener("click", logout);


async function checkLogin() {

    const client = getSupabaseClient();

    if (!client) {
        return;
    }


    const result =
        await client.auth.getSession();


    if (result.data.session) {

        document
            .getElementById("loginSection")
            .classList.add("hidden");


        document
            .getElementById("dashboardSection")
            .classList.remove("hidden");


        await loadDashboard();
    }
}


checkLogin();

</script>

</body>
</html>
